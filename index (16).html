<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELPA21 Reading Studio — Mississippi EL Practice Platform (K–12)</title>
<meta name="description" content="A strenuous, professional ELPA21/ELPT-style reading practice platform for Mississippi English learners, K–12. Practice and test modes, eight item types, accommodations, bilingual supports, teacher dashboard. EL Publishing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1E2761; --navy-2:#2b3a8a; --navy-3:#141b45; --gold:#C9A227; --gold-2:#e2bd3e; --gold-soft:#fbf3d9;
  --ink:#1b1f2a; --ink-2:#4a5160; --muted:#6b7280; --line:#e3e6ee; --bg:#f4f5f9; --card:#ffffff;
  --ok:#1f8a4c; --ok-soft:#e3f5ea; --bad:#c0392b; --bad-soft:#fbe6e3; --warn:#b7791f; --warn-soft:#fff4dc; --info:#2563eb; --info-soft:#e7efff;
  --l1:#c0392b; --l2:#e67e22; --l3:#d4a017; --l4:#2e8b57; --l5:#1E2761;
  --radius:14px; --shadow:0 6px 24px rgba(20,27,69,.08); --shadow-2:0 2px 8px rgba(20,27,69,.08);
  --font-body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; --font-head:'Fraunces',Georgia,serif;
  --fs:17px; --lh:1.65; --pass-fs:1.06rem;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:var(--lh);-webkit-font-smoothing:antialiased}
body.dyslexic{--font-body:'Atkinson Hyperlegible',Inter,sans-serif}
body.contrast-dark{--bg:#0f1220;--card:#181c2e;--ink:#f3f4f8;--ink-2:#c9cde0;--muted:#a3a8bf;--line:#2d3350;--gold-soft:#2a2a1c;--info-soft:#1c2a4a;--ok-soft:#163022;--bad-soft:#3a1c1a;--warn-soft:#332a14}
body.contrast-cream{--bg:#f6efd9;--card:#fffaea;--ink:#2b2a22;--line:#e3d9b8}
body.contrast-blue{--bg:#dfeaf7;--card:#eef5ff;--ink:#0d1b33;--line:#c5d6ee}
body.contrast-yellow{--bg:#111;--card:#1b1b1b;--ink:#ffe600;--ink-2:#ffe600;--muted:#e2cf4a;--line:#444;--info-soft:#2a2a00;--gold-soft:#2a2a00;--ok-soft:#1d2a1d;--bad-soft:#2a1d1d;--warn-soft:#2a2a1d}
h1,h2,h3,h4{font-family:var(--font-head);color:var(--navy);line-height:1.2;margin:0 0 .5rem}
body.contrast-dark h1,body.contrast-dark h2,body.contrast-dark h3,body.contrast-dark h4,body.contrast-yellow h1,body.contrast-yellow h2,body.contrast-yellow h3,body.contrast-yellow h4{color:var(--gold-2)}
h1{font-size:2.1rem;font-weight:900}h2{font-size:1.55rem;font-weight:700}h3{font-size:1.2rem;font-weight:700}
p{margin:0 0 .8rem}
a{color:var(--navy-2)}
button{font-family:inherit;font-size:1rem;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;left:-9999px}
.hidden{display:none!important}

/* ---------- Layout ---------- */
.topbar{background:linear-gradient(135deg,var(--navy-3),var(--navy) 60%,var(--navy-2));color:#fff;padding:.6rem 1.2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;box-shadow:var(--shadow-2);position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:#fff}
.brand .mark{width:40px;height:40px;border-radius:10px;background:var(--gold);display:grid;place-items:center;font-family:var(--font-head);font-weight:900;color:var(--navy);font-size:1.1rem;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.brand .t{font-family:var(--font-head);font-weight:700;font-size:1.15rem;line-height:1.1}
.brand .s{font-size:.7rem;opacity:.85;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;gap:.3rem;margin-left:auto;flex-wrap:wrap}
.nav button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25);padding:.45rem .85rem;border-radius:999px;font-weight:600;font-size:.9rem}
.nav button.active,.nav button:hover{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.lang-toggle{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:999px;overflow:hidden}
.lang-toggle button{background:transparent;color:#fff;border:0;padding:.4rem .7rem;font-weight:700;font-size:.85rem}
.lang-toggle button.active{background:#fff;color:var(--navy)}
.wrap{max-width:1180px;margin:0 auto;padding:1.4rem 1.2rem 4rem}
.grid{display:grid;gap:1.2rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.3rem;box-shadow:var(--shadow)}
.card.tight{padding:1rem}
.card h3 .ic{margin-right:.4rem}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800}
.lead{font-size:1.08rem;color:var(--ink-2)}
.hero{background:linear-gradient(135deg,var(--navy-3),var(--navy) 55%,var(--navy-2));color:#fff;border-radius:20px;padding:2.2rem 2rem;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero h1,.hero h2{color:#fff}
.hero .eyebrow{color:var(--gold-2)}
.hero p{color:rgba(255,255,255,.88);max-width:62ch}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,39,.35),transparent 65%)}
.pill{display:inline-block;padding:.2rem .65rem;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--gold-soft);color:var(--navy);border:1px solid #efd98a}
body.contrast-dark .pill{color:var(--gold-2);border-color:#5a4d1c}
.pill.info{background:var(--info-soft);color:var(--info);border-color:#bcd1ff}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:#a9dcbb}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:#f3b9b2}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:#f1d79a}
.pill.gray{background:var(--bg);color:var(--muted);border-color:var(--line)}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:.6rem}
.mt{margin-top:1rem}.mt2{margin-top:1.6rem}.mb{margin-bottom:1rem}
.small{font-size:.86rem;color:var(--muted)}
.tiny{font-size:.76rem;color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:1rem 0}

/* ---------- Buttons/forms ---------- */
.btn{display:inline-flex;align-items:center;gap:.45rem;padding:.65rem 1.1rem;border-radius:10px;border:1px solid var(--navy);background:var(--navy);color:#fff;font-weight:700;transition:.15s;text-decoration:none}
.btn:hover{background:var(--navy-2);transform:translateY(-1px)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.gold:hover{background:var(--gold-2)}
.btn.ghost{background:transparent;color:var(--navy);border-color:var(--navy)}
body.contrast-dark .btn.ghost,body.contrast-yellow .btn.ghost{color:var(--ink);border-color:var(--ink)}
.btn.ghost:hover{background:var(--info-soft)}
.btn.danger{background:var(--bad);border-color:var(--bad)}
.btn.sm{padding:.4rem .75rem;font-size:.86rem;border-radius:8px}
.btn.lg{padding:.9rem 1.5rem;font-size:1.08rem;border-radius:12px}
.btn.block{width:100%;justify-content:center}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
label.f{display:block;font-weight:600;font-size:.9rem;margin-bottom:.3rem;color:var(--ink-2)}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;padding:.65rem .8rem;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:1rem;background:var(--card);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.field{margin-bottom:.9rem}
.check{display:flex;align-items:center;gap:.5rem;font-size:.95rem;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--navy)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--card);color:var(--ink-2);border:0;padding:.55rem .9rem;font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.active{background:var(--navy);color:#fff}
.band-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem}
.band{border:2px solid var(--line);border-radius:12px;padding:.9rem;background:var(--card);cursor:pointer;text-align:left;transition:.15s}
.band:hover{border-color:var(--gold)}
.band.active{border-color:var(--navy);background:var(--info-soft);box-shadow:0 0 0 3px rgba(30,39,97,.12)}
.band .b{font-family:var(--font-head);font-size:1.3rem;font-weight:900;color:var(--navy)}
.band .d{font-size:.78rem;color:var(--muted)}
.mode-card{border:2px solid var(--line);border-radius:14px;padding:1.1rem;background:var(--card);cursor:pointer;text-align:left;transition:.15s;height:100%}
.mode-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.mode-card.active{border-color:var(--navy);background:var(--info-soft)}
.mode-card .ic{font-size:1.8rem}
.mode-card h4{margin:.3rem 0 .2rem;font-size:1.05rem}
.mode-card p{font-size:.86rem;color:var(--muted);margin:0}

/* ---------- Test shell (DRC-style) ---------- */
.test{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column}
.tbar{background:var(--navy-3);color:#fff;padding:.5rem .9rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;border-bottom:3px solid var(--gold)}
.tbar .who{font-weight:700;font-size:.9rem}
.tbar .who small{opacity:.75;font-weight:500;margin-left:.4rem}
.tbar .cnt{margin-left:auto;font-weight:800;font-family:var(--font-head);font-size:1.05rem}
.tbar .timer{font-variant-numeric:tabular-nums;background:rgba(255,255,255,.12);padding:.25rem .6rem;border-radius:8px;font-weight:700}
.tbar .timer.low{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.tools{background:var(--card);border-bottom:1px solid var(--line);padding:.35rem .7rem;display:flex;gap:.3rem;flex-wrap:wrap;align-items:center}
.tools button{background:transparent;border:1px solid var(--line);border-radius:8px;padding:.35rem .6rem;font-size:.82rem;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:.3rem}
.tools button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tools button:hover{border-color:var(--navy)}
.tools .sep{width:1px;height:22px;background:var(--line);margin:0 .2rem}
.tbody{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0;overflow:hidden}
.tbody.single{grid-template-columns:1fr}
.pane{overflow:auto;padding:1.3rem 1.5rem;position:relative}
.pane.passage{border-right:1px solid var(--line);background:var(--card)}
.pane.item{background:var(--bg)}
@media(max-width:900px){.tbody{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto}.pane.passage{border-right:0;border-bottom:2px solid var(--line);max-height:46vh}}
.tfoot{background:var(--card);border-top:1px solid var(--line);padding:.6rem .9rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.tfoot .spacer{flex:1}
.progress{height:8px;background:var(--line);border-radius:999px;overflow:hidden;flex:1;min-width:120px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--navy-2));transition:.3s}

/* Passage styling */
.ptitle{font-family:var(--font-head);font-size:1.45rem;font-weight:700;color:var(--navy);margin:0 0 .25rem}
.pkind{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:.8rem}
.ptext{font-size:var(--pass-fs);line-height:1.8;max-width:68ch}
.ptext p{margin:0 0 1rem}
.ptext .ln{display:inline-block;width:2.2rem;color:var(--muted);font-size:.72rem;user-select:none;vertical-align:top;font-family:var(--font-body)}
.ptext .sent{border-radius:4px;padding:1px 2px;transition:.15s}
.ptext.hot .sent{cursor:pointer;border-bottom:2px dashed transparent}
.ptext.hot .sent:hover{background:var(--info-soft)}
.ptext .sent.sel{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold)}
.ptext .sent.hl{background:#fff2a8}
body.contrast-dark .ptext .sent.hl{background:#5a4d1c}
.ptext .gl{border-bottom:2px dotted var(--gold);cursor:help;position:relative}
.ptext .gl:hover::after{content:attr(data-g);position:absolute;left:0;top:1.6em;background:var(--navy);color:#fff;padding:.4rem .6rem;border-radius:8px;font-size:.82rem;white-space:normal;width:max-content;max-width:260px;z-index:5;line-height:1.4;box-shadow:var(--shadow)}
.ptext.hl-mode .sent{cursor:cell}
.pimg{font-size:4rem;line-height:1;text-align:center;margin:.3rem 0 1rem}
.notice{border:1.5px solid var(--line);border-radius:12px;padding:1rem 1.2rem;background:var(--gold-soft);font-size:1rem}
.notice h4{margin:0 0 .4rem}
.sched{width:100%;border-collapse:collapse;font-size:.95rem}
.sched th,.sched td{border:1px solid var(--line);padding:.45rem .6rem;text-align:left}
.sched th{background:var(--info-soft)}
/* line reader */
.linereader{position:absolute;left:0;right:0;height:3.2em;background:rgba(201,162,39,.22);border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);pointer-events:none;z-index:4}
/* masking */
.mask-top,.mask-bot{position:absolute;left:0;right:0;background:rgba(20,27,69,.82);pointer-events:none;z-index:3}

/* Item styling */
.stem{font-size:1.12rem;font-weight:600;margin-bottom:1rem;line-height:1.55}
.stem .es{display:block;font-weight:500;font-size:.95rem;color:var(--ink-2);margin-top:.35rem;font-style:italic}
.directions{font-size:.9rem;color:var(--ink-2);background:var(--info-soft);padding:.55rem .8rem;border-radius:8px;margin-bottom:.9rem;border-left:4px solid var(--info)}
.opts{display:grid;gap:.6rem}
.opt{display:flex;gap:.75rem;align-items:flex-start;padding:.8rem .95rem;border:2px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;width:100%;font-size:1.02rem;line-height:1.5;transition:.12s;position:relative;color:var(--ink)}
.opt:hover{border-color:var(--navy-2)}
.opt .k{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:.9rem;color:var(--ink-2)}
.opt.sel{border-color:var(--navy);background:var(--info-soft);box-shadow:0 0 0 3px rgba(30,39,97,.12)}
.opt.sel .k{background:var(--navy);color:#fff;border-color:var(--navy)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.struck{opacity:.45;text-decoration:line-through}
.opt .elim{position:absolute;right:.5rem;top:.5rem;border:1px solid var(--line);background:var(--card);border-radius:6px;font-size:.72rem;padding:.1rem .4rem;color:var(--muted)}
.opt.pic{flex-direction:column;align-items:center;text-align:center}
.opt .emoji{font-size:3rem;line-height:1}
.opts.pics{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
/* order */
.order-list{display:grid;gap:.5rem}
.order-item{display:flex;align-items:center;gap:.6rem;padding:.7rem .8rem;border:2px solid var(--line);border-radius:10px;background:var(--card);cursor:grab}
.order-item.dragging{opacity:.5}
.order-item .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.85rem}
.order-item .mv{margin-left:auto;display:flex;gap:.2rem}
.order-item .mv button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:.15rem .45rem;color:var(--ink)}
.order-item.ok{border-color:var(--ok);background:var(--ok-soft)}.order-item.bad{border-color:var(--bad);background:var(--bad-soft)}
/* match grid */
.mgrid{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem}
.mgrid th,.mgrid td{border:1px solid var(--line);padding:.55rem .6rem;vertical-align:middle;background:var(--card)}
.mgrid th{background:var(--info-soft);font-weight:700;text-align:center}
.mgrid th:first-child{text-align:left}
.mgrid td.c{text-align:center}
.mgrid input[type=radio],.mgrid input[type=checkbox]{width:22px;height:22px;accent-color:var(--navy);cursor:pointer}
.mgrid tr.ok td{background:var(--ok-soft)}.mgrid tr.bad td{background:var(--bad-soft)}
/* cloze */
.cloze{font-size:1.08rem;line-height:2.2}
.blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--navy);text-align:center;padding:0 .4rem;margin:0 .15rem;cursor:pointer;border-radius:6px 6px 0 0;font-weight:700;color:var(--navy)}
.blank.target{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold)}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.bad{color:var(--bad);border-color:var(--bad)}
.bank{display:flex;gap:.5rem;flex-wrap:wrap;margin:.8rem 0;padding:.7rem;border:1.5px dashed var(--line);border-radius:10px;background:var(--card)}
.chip{padding:.4rem .8rem;border:2px solid var(--navy);border-radius:999px;background:var(--card);font-weight:700;color:var(--navy);cursor:pointer}
.chip.used{opacity:.35;text-decoration:line-through}
.chip.active{background:var(--navy);color:#fff}
body.contrast-dark .chip{color:var(--gold-2);border-color:var(--gold-2)}
/* feedback */
.fb{margin-top:1rem;padding:.9rem 1rem;border-radius:10px;border-left:5px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb b{display:block;margin-bottom:.2rem}
.tags{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.8rem}
.flagbtn.on{background:var(--warn);color:#fff;border-color:var(--warn)}
/* navigator */
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:.4rem}
.navgrid button{height:42px;border-radius:8px;border:2px solid var(--line);background:var(--card);font-weight:700;color:var(--ink)}
.navgrid button.ans{background:var(--info-soft);border-color:var(--navy-2)}
.navgrid button.flag{border-color:var(--warn);background:var(--warn-soft)}
.navgrid button.cur{outline:3px solid var(--gold)}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,30,.55);z-index:200;display:grid;place-items:center;padding:1rem}
.modal{background:var(--card);border-radius:16px;padding:1.5rem;max-width:720px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.notepad{width:100%;min-height:140px}

/* ---------- Results ---------- */
.gauge{display:flex;gap:.3rem;align-items:flex-end;height:90px;margin:.6rem 0}
.gauge div{flex:1;border-radius:6px 6px 0 0;display:grid;place-items:end center;color:#fff;font-weight:800;font-size:.85rem;padding-bottom:.3rem;opacity:.3}
.gauge div.on{opacity:1}
.gauge .l1{background:var(--l1);height:30%}.gauge .l2{background:var(--l2);height:45%}.gauge .l3{background:var(--l3);height:60%}.gauge .l4{background:var(--l4);height:80%}.gauge .l5{background:var(--l5);height:100%}
.score-big{font-family:var(--font-head);font-size:3.4rem;font-weight:900;color:var(--navy);line-height:1}
body.contrast-dark .score-big{color:var(--gold-2)}
.lvl-badge{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:50%;color:#fff;font-family:var(--font-head);font-weight:900;font-size:2rem;box-shadow:var(--shadow)}
.lvl-1{background:var(--l1)}.lvl-2{background:var(--l2)}.lvl-3{background:var(--l3)}.lvl-4{background:var(--l4)}.lvl-5{background:var(--l5)}
.bar{height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy-2);border-radius:999px}
.bar i.lo{background:var(--bad)}.bar i.mid{background:var(--warn)}.bar i.hi{background:var(--ok)}
.table{width:100%;border-collapse:collapse;font-size:.92rem}
.table th,.table td{padding:.55rem .6rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.table th{background:var(--info-soft);font-weight:700;position:sticky;top:0}
.table tr:hover td{background:var(--bg)}
.table .num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow:auto;max-height:480px;border:1px solid var(--line);border-radius:10px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.7rem}
.badge{border:1.5px solid var(--line);border-radius:12px;padding:.8rem .5rem;text-align:center;background:var(--card)}
.badge .e{font-size:2rem}
.badge .n{font-weight:700;font-size:.82rem;margin-top:.2rem}
.badge .d{font-size:.72rem;color:var(--muted)}
.badge.locked{opacity:.38;filter:grayscale(1)}
.stat{text-align:center;padding:.9rem;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.stat .v{font-family:var(--font-head);font-size:2rem;font-weight:900;color:var(--navy)}
body.contrast-dark .stat .v{color:var(--gold-2)}
.stat .l{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;word-break:break-all;background:var(--bg);padding:.7rem;border-radius:8px;border:1px dashed var(--line)}
.cert{border:12px double var(--gold);padding:2.5rem;text-align:center;background:#fffdf5;color:#1b1f2a}
.cert h1{font-size:2.6rem;color:var(--navy)}
.cert .name{font-family:var(--font-head);font-size:2.2rem;font-weight:700;color:var(--navy);border-bottom:2px solid var(--gold);display:inline-block;padding:0 2rem .3rem;margin:.8rem 0}
.heat td.h0{background:#f8d7d3}.heat td.h1{background:#fde9c9}.heat td.h2{background:#fff6c7}.heat td.h3{background:#d7f0dd}.heat td.h4{background:#b8e2c4}
body.contrast-dark .heat td{color:#111}
.kbd{font-family:ui-monospace,monospace;font-size:.78rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 .35rem;background:var(--bg)}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%) translateY(30px);background:var(--navy);color:#fff;padding:.7rem 1.1rem;border-radius:10px;font-weight:600;opacity:0;transition:.25s;z-index:300;pointer-events:none;box-shadow:var(--shadow);max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.footer{margin-top:3rem;text-align:center;font-size:.8rem;color:var(--muted)}
.xp-pop{position:fixed;right:1.2rem;top:5rem;background:var(--gold);color:var(--navy);font-weight:900;padding:.5rem .9rem;border-radius:999px;z-index:300;animation:xp 1.6s forwards;box-shadow:var(--shadow)}
@keyframes xp{0%{opacity:0;transform:translateY(10px)}20%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.streak{font-size:1.4rem}
.std-list{display:grid;gap:.5rem}
.std-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 64px;gap:.7rem;align-items:center;font-size:.86rem}
@media(max-width:600px){.std-row{grid-template-columns:1fr 100px 50px}}
.tabs{display:flex;gap:.3rem;border-bottom:2px solid var(--line);margin-bottom:1rem;flex-wrap:wrap}
.tabs button{background:transparent;border:0;padding:.6rem .9rem;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.active{color:var(--navy);border-bottom-color:var(--gold)}
body.contrast-dark .tabs button.active{color:var(--gold-2)}
.zoom-1{--fs:17px;--pass-fs:1.06rem}.zoom-2{--fs:19px;--pass-fs:1.2rem}.zoom-3{--fs:22px;--pass-fs:1.4rem}.zoom-4{--fs:26px;--pass-fs:1.65rem}
.blueprint td:first-child{font-weight:600}
@media print{
  .topbar,.nav,.tools,.tfoot,.noprint,.toast{display:none!important}
  body{background:#fff}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .wrap{max-width:100%;padding:0}
  .test{position:static}
}

      ["A catfish farm works on a schedule.", "In the spring, farmers stock the ponds with fingerlings, young catfish about the size of a finger.", "Workers feed the fish floating pellets made from soybeans and corn, two other crops that grow in the Delta.", "In about eighteen months, the fish weigh one to two pounds and are ready for harvest.", "Crews pull long nets called seines across the pond to gather the fish.", "Trucks with tanks of water carry the live catfish to processing plants in towns such as Belzoni, which calls itself the \"Catfish Capital of the World.\""],
      ["The industry has faced challenges.", "Cheaper fish imported from other countries have pushed prices down, and the number of pond acres in Mississippi is smaller than it was twenty years ago.", "Still, catfish farming supports thousands of jobs in a region that needs them.", "Every April, Belzoni holds the World Catfish Festival, complete with a catfish-eating contest, to celebrate the fish that changed the Delta."]
    ], gl:{ "producer":"a person or place that makes or grows something", "fingerlings":"very small young fish", "harvest":"to gather a crop when it is ready", "imported":"brought in from another country", "industry":"a type of business" } },

  { id:"68-P1", title:"Highway 61: The Road the Blues Traveled", kind:"informational", img:"🎸🛣️", words:297, lexile:"930L",
    paras:[
      ["U.S. Highway 61 runs north from New Orleans through the flat cotton country of the Mississippi Delta, past Vicksburg, Clarksdale, and Tunica, and on toward Memphis and the cities of the Midwest.", "Maps call it a federal highway.", "Musicians call it the Blues Highway, and the name is not an exaggeration."],
      ["The blues grew out of the work songs, field hollers, and church music of African Americans in the Delta in the late 1800s.", "Life on the plantations was harsh, and the music gave voice to hardship, humor, and hope.", "Early blues musicians played on porches, at juke joints, and at Saturday-night fish fries, often with a single guitar and a voice that could carry across a field."],
      ["Highway 61 mattered because it was a way out.", "During the Great Migration, from roughly 1916 to 1970, millions of Black Southerners left for Northern cities in search of jobs and relief from segregation.", "Many followed Highway 61 to Memphis, St. Louis, and Chicago.", "Musicians such as Muddy Waters carried the acoustic Delta sound north, plugged in electric guitars to be heard over noisy clubs, and created the Chicago blues.", "That amplified sound, in turn, shaped rock and roll."],
      ["Today, Mississippi has marked more than two hundred sites on its Blues Trail with blue metal markers.", "In Clarksdale, visitors can stand at the \"crossroads\" of Highways 61 and 49, where legend says guitarist Robert Johnson traded his soul for musical skill.", "Historians note that the story is folklore, not fact, but it draws tourists from around the world."],
      ["The highway is quieter now; interstates carry most of the traffic.", "Yet the route remains a thread connecting Delta towns to the music they produced.", "As one Clarksdale museum guide puts it, \"You can't understand American music without understanding this road.\""]
    ], gl:{ "exaggeration":"a statement that makes something seem bigger than it is", "harsh":"very difficult or severe", "juke joints":"small, informal clubs with music and dancing", "segregation":"laws that separated people by race", "amplified":"made louder with electricity", "folklore":"traditional stories passed down, not proven history" } },
  { id:"68-P2", title:"Letter to the Editor: Let Teens Sleep", kind:"argument", img:"⏰📰", words:255, lexile:"960L",
    paras:[
      ["To the Editor:"],
      ["Our middle school's first bell rings at 7:15 a.m.", "For many students, that means a bus pickup before 6:30.", "I am writing to urge the school board to move the start time to 8:30 or later.", "The evidence is clear, and the cost of ignoring it is high."],
      ["First, adolescents are biologically wired to fall asleep later.", "During puberty, the body's release of melatonin, the hormone that signals sleepiness, shifts about two hours later.", "A teenager who cannot fall asleep before 11:00 p.m. and must wake at 5:45 a.m. is getting far less than the eight to ten hours that the American Academy of Pediatrics recommends."],
      ["Second, later start times improve results.", "When one Seattle district pushed its start time back by 55 minutes, researchers found that students slept 34 minutes longer on average, and grades in the classes they studied rose by 4.5 percent.", "Attendance and punctuality improved as well."],
      ["Some people argue that a later start will interfere with after-school sports and jobs.", "That concern is understandable, but districts that have made the change simply shifted practice schedules, and most report that the adjustment took one season.", "Others worry about bus costs.", "Yet several districts saved money by running the same buses for elementary and secondary routes in a different order."],
      ["Sleep is not a luxury for teenagers; it is a requirement for learning.", "Our board should follow the science and give students a fighting chance to be awake when the learning begins."],
      ["— Dana Whitfield, parent and school nurse"]
    ], gl:{ "urge":"to strongly encourage", "adolescents":"young people between childhood and adulthood", "melatonin":"a hormone the body makes that causes sleepiness", "punctuality":"being on time", "luxury":"something nice but not necessary" } },
  { id:"68-P3", title:"The Tryout", kind:"literary", img:"🏀🏫", words:288, lexile:"820L",
    paras:[
      ["Marisol had been in the United States for exactly four months, and she had counted every one of them.", "Four months of nodding when she did not understand, of eating lunch with a book open so no one would see she had nobody to talk to."],
      ["The flyer on the gym door said TRYOUTS — THURSDAY — 3:30.", "She understood <i>tryouts</i>.", "Basketball was basketball in any language."],
      ["On Thursday she stood at the edge of the court while Coach Barnes called out drills.", "The other girls moved before the words were finished.", "Marisol watched their feet and copied them half a second late.", "Layups, she understood.", "\"Box out\" she did not, until a girl named Keisha bumped her out of the way under the basket and then, without a word, pointed at the spot where Marisol should have been."],
      ["During the scrimmage, Marisol got the ball at the top of the key.", "She heard \"Pass!\" and \"Shoot!\" at the same time and froze.", "The ball was stolen.", "She wanted to disappear into the floor."],
      ["But on the next possession Keisha drove to the basket, drew two defenders, and flicked the ball out to Marisol in the corner.", "No words this time, just a look.", "Marisol caught it, squared her feet the way her father had taught her in the dusty lot behind their old house, and shot.", "The net snapped."],
      ["\"Now <i>that</i>,\" Coach Barnes said, \"is a corner three.\"", "He wrote something on his clipboard."],
      ["After practice, Keisha fell into step beside her.", "\"You hesitate too much,\" she said.", "Marisol knew <i>hesitate</i>; it meant waiting too long.", "\"But your shot is clean.", "See you tomorrow?\""],
      ["Marisol nodded, and this time she understood exactly what she was agreeing to."]
    ], gl:{ "drills":"practice exercises", "scrimmage":"a practice game", "possession":"a team's turn with the ball", "hesitate":"to pause because you are unsure" } },

  { id:"912-P1", title:"Leaving the Delta: The Great Migration and the Towns Left Behind", kind:"informational", img:"🚂🏙️", words:414, lexile:"1120L",
    paras:[
      ["Between roughly 1916 and 1970, about six million African Americans left the rural South for cities in the North, Midwest, and West.", "Historians call this movement the Great Migration, and few places felt it more sharply than the Mississippi Delta, the flat, fertile floodplain between the Mississippi and Yazoo rivers."],
      ["The reasons for leaving were both economic and political.", "Most Black families in the Delta worked as sharecroppers, farming land they did not own in exchange for a share of the cotton crop.", "Because landowners controlled the accounts, sharecroppers frequently ended the year in debt no matter how hard they worked.", "At the same time, Jim Crow laws enforced segregation, denied voting rights, and left Black residents with little protection from violence.", "When Northern factories began recruiting workers during World War I, offering wages that could be three times what a field hand earned, the choice for many families became clear."],
      ["The Illinois Central Railroad, which ran straight through the Delta to Chicago, became the migration's main artery.", "The <i>Chicago Defender</i>, a Black-owned newspaper smuggled south by Pullman porters, printed train schedules, job listings, and letters from migrants describing their new lives.", "Entire church congregations sometimes left together, and Delta towns developed sister communities on Chicago's South Side."],
      ["The migration transformed the destinations.", "Chicago's Black population grew from about 44,000 in 1910 to more than 800,000 by 1960.", "Delta music, food, and religious traditions reshaped the culture of Northern cities, from blues clubs to the storefront churches that lined the avenues."],
      ["It also transformed the places left behind.", "As field workers departed, Delta planters invested in mechanical cotton pickers, which by the 1950s could do the work of dozens of laborers.", "Mechanization and migration fed each other: fewer workers meant more machines, and more machines meant fewer jobs.", "Some Delta counties lost more than half of their population between 1940 and 1980, and many towns never recovered the businesses, schools, and tax base that had depended on them."],
      ["Yet the story is not only one of loss.", "The movement built a Black middle class and political power that would help fuel the civil rights movement, and money sent home by migrants sustained relatives in the Delta.", "In recent decades a smaller \"reverse migration\" has brought some families back South in search of lower costs and family roots.", "The Delta they return to is emptier than the one their grandparents left, but its influence on American culture, carried north on the Illinois Central, remains everywhere."]
    ], gl:{ "fertile":"good for growing crops", "sharecroppers":"farmers who worked land owned by someone else for a share of the crop", "recruiting":"actively seeking people to hire", "artery":"a main route or channel", "congregations":"groups of people who belong to a church", "mechanization":"replacing human labor with machines", "sustained":"supported; kept going" } },
  { id:"912-P2", title:"Editorial: Keep the Westside Pool Open", kind:"argument", img:"🏊📰", words:376, lexile:"1080L",
    paras:[
      ["Next month the city council will vote on whether to close the Westside Community Pool to save an estimated $180,000 a year.", "On paper, the savings are real.", "In practice, closing the pool would cost this city far more than it saves."],
      ["Begin with safety.", "Drowning is the second leading cause of accidental death for children under fourteen in Mississippi, and the state's rate is well above the national average.", "The Westside Pool is the only public pool within eight miles of the neighborhoods it serves, and its free summer lessons taught more than 600 children to swim last year.", "If the pool closes, those children do not stop swimming; they move to creeks, retention ponds, and the river, where no lifeguard is watching."],
      ["Consider the economics as well.", "The pool employs 22 teenagers each summer, many in their first jobs.", "Studies of youth employment consistently find that a first job at sixteen or seventeen is associated with higher earnings and lower arrest rates years later.", "The council's $180,000 figure also ignores the cost of the pool sitting empty: a drained, fenced pool still requires maintenance, insurance, and eventually demolition, which a 2023 estimate placed at $240,000."],
      ["Supporters of closure argue that attendance has fallen 30 percent since 2015 and that residents can use the private aquatic club across town.", "Attendance has indeed dropped, but largely because the city cut the pool's hours in 2019 and stopped running the free shuttle from the elementary schools.", "Shrinking a service and then citing low use is circular reasoning.", "As for the aquatic club, a family membership there costs $95 a month, nearly a week's take-home pay for many Westside households."],
      ["There are cheaper ways to save $180,000.", "The council could restore the shuttle and hours, which raised attendance by 40 percent the last time they were in place, and charge a modest fee to nonresidents.", "It could seek a partnership with the school district, which already pays to bus students to the aquatic club for physical education."],
      ["A pool is not a luxury line item.", "It is a safety program, a jobs program, and one of the few places in this city where families from every neighborhood share the same water.", "The council should vote no on closure."]
    ], gl:{ "estimated":"roughly calculated", "retention ponds":"man-made ponds that collect rainwater", "demolition":"tearing down a structure", "circular reasoning":"an argument that uses its conclusion as its own proof", "modest":"small; not extreme" } },
  { id:"912-P3", title:"First Shift", kind:"literary", img:"🍗🧾", words:401, lexile:"990L",
    paras:[
      ["The poultry plant in Collins ran three shifts, and Yesenia's father had worked the second one for eleven years, which was why she knew the sound of a car door at 11:40 p.m. the way other kids knew their mother's voice.", "What she had not known, until her first shift at the Chicken Shack on Highway 49, was how much a person could learn in six hours about standing still."],
      ["\"Register's easy,\" said Deshawn, the shift lead, who was seventeen and had clearly given this speech before.", "\"It's the people who are hard.\"", "He showed her the buttons twice, then once more when her hand hovered over the screen like it was hot."],
      ["The first customer wanted a number four with no pickles, and Yesenia heard \"no pickles\" as \"more pickles,\" and the man's face did a thing she would think about on the drive home.", "The second customer was a woman from church who spoke to her in Spanish, slowly, as if Yesenia were the one who might not understand, and then tipped a dollar in the jar and said, \"<i>Primer día, mija?</i>\""],
      ["By seven o'clock the line reached the door.", "Yesenia stopped translating in her head.", "There was no time.", "A number, a drink size, a yes or no about sauce, the drawer sliding open and shut.", "She noticed that Deshawn never looked at the register; he looked at the customer, and the customer, looked at, became patient."],
      ["At 8:15 the man with the pickles came back.", "Yesenia's stomach dropped.", "He set his tray on the counter, and she braced for it, but all he said was, \"Y'all forgot my sweet tea,\" and she said, \"I'm sorry, sir, I'll get it right now,\" and she did, and he said, \"Appreciate you,\" the way people here said it, as a whole sentence."],
      ["At the end of the shift, Deshawn counted her drawer.", "It was eleven cents over.", "\"Nobody's ever exactly right,\" he said.", "\"Over's better than under.\""],
      ["Her father was waiting in the lot with the engine running, still in his plant boots, and he did not ask how it went, because he knew.", "She climbed in and smelled fryer oil on her own hair and chlorine on his sleeves, two kinds of work in one small car, and thought that she had never in her life been so tired or so sure that she could do this again tomorrow."]
    ], gl:{ "poultry":"chickens and other birds raised for food", "hovered":"stayed in the air over something", "braced":"got ready for something unpleasant", "drawer":"the cash drawer of a register" } },
  { id:"912-P4", title:"Teen Volunteer Program — Frequently Asked Questions", kind:"notice", img:"📚🤝", words:210, lexile:"BR",
    notice:{ head:"Laurel-Jones County Library — Teen Volunteer Program (ages 14–18)", lines:[
      "Who can apply? Students ages 14–18 with a library card in good standing. Applicants under 16 must submit a parent consent form with the application.",
      "What do volunteers do? Shelve returned books, assist with children's story time, prepare craft kits, and help patrons use the public computers. Volunteers do not handle money or patron records.",
      "How many hours? Volunteers commit to at least one two-hour shift per week for eight weeks. Hours are documented on a signed log that can be used for school service requirements and scholarship applications.",

  { id:"912-16", p:"912-P3", type:"mc", std:"ELP.1", skill:"INF", ela:"RL.9-10.3", dok:3,

  { id:"912-19", p:"912-P3", type:"mc", std:"ELP.8", skill:"VOC", ela:"L.9-10.5", dok:3,

    options:["It shows the car needs cleaning.","It links Yesenia's first job to her father's years of work, suggesting she now shares in the family's dignity of labor.","It shows that both jobs are dangerous.","It suggests Yesenia wants to work at the poultry plant."], answer:1,

    explain:"The Spring row lists an application deadline of Jan 16 and orientation on Jan 23 at 4:00 p.m." },

</script>
<script>
/* ============================================================
   ELPA21 Reading Studio — application core
   ============================================================ */
"use strict";
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const todayKey = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtDate = iso => { try{ return new Date(iso).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }catch(e){ return iso; } };
const pct = (c,n) => n? Math.round(100*c/n) : 0;
const uid = () => Math.random().toString(36).slice(2,8).toUpperCase();
function shuffle(arr, seed){ // deterministic Fisher–Yates when seed given
  const a = arr.slice(); let s = seed||Math.floor(Math.random()*1e9);
  const rnd = () => { s = (s*1664525+1013904223) % 4294967296; return s/4294967296; };
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a;
}
function hashStr(str){ let h=2166136261; for(const ch of str){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return Math.abs(h); }
function toast(msg, ms=2200){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),ms); }
function xpPop(n){ const d=document.createElement("div"); d.className="xp-pop"; d.textContent="+"+n+" XP"; document.body.appendChild(d); setTimeout(()=>d.remove(),1700); }

/* ---------- storage ---------- */
const DB = {
  get(k, def){ try{ const v=localStorage.getItem("ers_"+k); return v? JSON.parse(v) : def; }catch(e){ return def; } },
  set(k, v){ try{ localStorage.setItem("ers_"+k, JSON.stringify(v)); return true; }catch(e){ toast("Storage is not available in this browser; progress will not be saved."); return false; } }
};
const DEFAULT_SETTINGS = { lang:"en", esDir:true, glossary:true, tts:false, dys:false, contrast:"", zoom:1, timer:0, lockScaffoldsInMock:true, teacherPin:"" };
const S = {
  settings: Object.assign({}, DEFAULT_SETTINGS, DB.get("settings", {})),
  view:"home", student:{ name:"", code:"", band:"", mode:"", skill:"" }, session:null, lastResult:null, teacherTab:"roster", teacherBand:"9-12", teacherOpen:false
};
const t = key => (I18N[S.settings.lang]||I18N.en)[key] ?? I18N.en[key] ?? key;
const L = (obj, key) => (S.settings.lang==="es" && obj[key+"_es"]) ? obj[key+"_es"] : (S.settings.lang==="es" && obj.es && key==="name") ? obj.es : obj[key];
function saveSettings(){ DB.set("settings", S.settings); applyBodyClasses(); }
function applyBodyClasses(){
  const b=document.body; b.className="";
  if(S.settings.dys) b.classList.add("dyslexic");
  if(S.settings.contrast) b.classList.add("contrast-"+S.settings.contrast);
  b.classList.add("zoom-"+(S.settings.zoom||1));
}
/* ---------- student records ---------- */
function studentKey(name){ return (name||"").trim().toLowerCase().replace(/\s+/g," "); }
function getStudents(){ return DB.get("students", {}); }
function getStudent(name){
  const all=getStudents(); const k=studentKey(name);
  return all[k] || { name:name.trim(), xp:0, badges:[], streak:{last:"",count:0,best:0}, sessions:[], skill:{}, std:{}, type:{}, items:0, perfect:0, fullTests:0, bestLevel:0, growth:0, bandsSeen:[] };
}
function saveStudent(rec){ const all=getStudents(); all[studentKey(rec.name)]=rec; DB.set("students", all); }

/* ---------- item helpers ---------- */
const ALL_ITEMS = () => Object.values(ITEMS).flat();
const itemById = id => ALL_ITEMS().find(i=>i.id===id);
const passageById = id => Object.values(PASSAGES).flat().find(p=>p.id===id);
const bandById = id => BANDS.find(b=>b.id===id);
function isCorrect(item, ans){
  if(ans==null) return false;
  switch(item.type){
    case "mc": case "pic": return ans===item.answer;
    case "ms": return Array.isArray(ans) && ans.length===item.answer.length && ans.slice().sort((a,b)=>a-b).every((v,i)=>v===item.answer.slice().sort((a,b)=>a-b)[i]);
    case "hot": return Array.isArray(ans) && ans[0]===item.answer[0] && ans[1]===item.answer[1];
    case "order": return Array.isArray(ans) && ans.length===item.answer.length && ans.every((v,i)=>v===item.answer[i]);
    case "match": return Array.isArray(ans) && ans.length===item.answer.length && ans.every((v,i)=>v===item.answer[i]);
    case "cloze": return Array.isArray(ans) && ans.length===item.answer.length && ans.every((v,i)=>v===item.answer[i]);
  }
  return false;
}
function isAnswered(item, ans){
  if(ans==null) return false;
  if(item.type==="ms") return ans.length>0;
  if(item.type==="match") return ans.every(v=>v!=null);
  if(item.type==="cloze") return ans.every(v=>v!=null);
  if(item.type==="order") return !!ans._moved;
  return true;
}
/* partial credit (practice feedback only) */
function partialScore(item, ans){
  if(ans==null) return 0;
  if(item.type==="match"||item.type==="cloze") return item.answer.filter((v,i)=>ans[i]===v).length/item.answer.length;
  if(item.type==="order") return item.answer.filter((v,i)=>ans[i]===v).length/item.answer.length;
  if(item.type==="ms"){ const correct=new Set(item.answer); let s=0; ans.forEach(a=>{ s += correct.has(a)?1:-1; }); return Math.max(0,s)/item.answer.length; }
  return isCorrect(item,ans)?1:0;
}

/* ---------- router / shell ---------- */
function render(){
  applyBodyClasses();
  const app=$("#app");
  if(S.view==="session" && S.session){ app.innerHTML = renderSession(); afterSessionRender(); return; }
  let body="";
  switch(S.view){
    case "home": body=renderHome(); break;
    case "results": body=renderResults(); break;
    case "progress": body=renderProgress(); break;
    case "teacher": body=renderTeacher(); break;
    case "about": body=renderAbout(); break;
    case "cert": body=renderCertificate(); break;
    default: body=renderHome();
  }
  app.innerHTML = renderTopbar() + `<div class="wrap">${body}</div>` + renderFooter();
  window.scrollTo(0,0);
}
function go(view){ S.view=view; render(); }
function renderTopbar(){
  const nav=[["home",t("student")],["progress",t("progress")],["teacher",t("teacher")],["about",t("about")]];
  return `<header class="topbar">
    <a class="brand" href="#" onclick="A.go('home');return false;"><div class="mark">EL</div><div><div class="t">ELPA21 Reading Studio</div><div class="s">${esc(t("tag"))}</div></div></a>
    <nav class="nav" aria-label="Main">${nav.map(([v,l])=>`<button class="${S.view===v?'active':''}" onclick="A.go('${v}')">${esc(l)}</button>`).join("")}</nav>
    <div class="lang-toggle" role="group" aria-label="Language"><button class="${S.settings.lang==='en'?'active':''}" onclick="A.lang('en')">EN</button><button class="${S.settings.lang==='es'?'active':''}" onclick="A.lang('es')">ES</button></div>
  </header>`;
}
function renderFooter(){
  return `<footer class="footer">ELPA21 Reading Studio v${APP_VERSION} · EL Publishing · Richard A. Daniel, M.Ed. · Laurel High School, Mississippi<br>Original practice content in the style of the ELPA21 / Mississippi ELPT reading domain. Not affiliated with ELPA21, CRESST, or the Mississippi Department of Education. Level estimates are for practice only.</footer>`;
}

/* ---------- HOME ---------- */
function renderHome(){
  const st=S.student; const banks=BANDS.map(b=>`<button class="band ${st.band===b.id?'active':''}" onclick="A.pickBand('${b.id}')"><div class="b">${esc(b.short)}</div><div class="d">${esc(b.label)}</div><div class="d">${ITEMS[b.id].length} items · ${PASSAGES[b.id].length} texts</div></button>`).join("");
  const modes=[["quick","⚡",t("mode_quick"),t("mode_quick_d")],["practice","🧭",t("mode_practice"),t("mode_practice_d")],["mock","📝",t("mode_mock"),t("mode_mock_d")],["skill","🎯",t("mode_skill"),t("mode_skill_d")]]
    .map(([id,ic,n,d])=>`<button class="mode-card ${st.mode===id?'active':''}" onclick="A.pickMode('${id}')"><div class="ic">${ic}</div><h4>${esc(n)}</h4><p>${esc(d)}</p></button>`).join("");
  const skills=Object.entries(SKILLS).map(([k,v])=>`<option value="${k}" ${st.skill===k?'selected':''}>${esc(S.settings.lang==='es'?v.es:v.name)}</option>`).join("");
  const rec = st.name? getStudent(st.name) : null;
  const ready = st.name.trim() && st.band && st.mode && (st.mode!=="skill" || st.skill);
  const timerOpts=[0,20,30,40,50,60].map(m=>`<option value="${m}" ${S.settings.timer==m?'selected':''}>${m===0?'Off':m+' '+t("min")}</option>`).join("");
  return `
  <section class="hero">
    <div class="eyebrow">Mississippi · ELPT / ELPA21 Reading Domain · K–12</div>
    <h1>${esc(t("welcome"))}</h1>
    <p class="lead" style="color:#fff">${esc(t("sub"))}</p>
    <div class="row mt"><span class="pill">8 item types</span><span class="pill">${ALL_ITEMS().length} original items</span><span class="pill">${Object.values(PASSAGES).flat().length} texts</span><span class="pill">Practice · Mock · Skill drills</span><span class="pill">Accommodations</span><span class="pill">Teacher dashboard</span></div>
  </section>
  <div class="grid g2 mt2">
    <div class="card">
      <h2>1 · ${esc(t("student"))}</h2>
      <div class="field"><label class="f" for="nm">${esc(t("name"))}</label><input id="nm" type="text" value="${esc(st.name)}" placeholder="First and last name" oninput="A.setName(this.value)" autocomplete="off"></div>
      <div class="field"><label class="f" for="cd">${esc(t("code"))}</label><input id="cd" type="text" value="${esc(st.code)}" placeholder="e.g. LHS-EL1" oninput="A.setCode(this.value)" autocomplete="off"></div>
      ${rec && rec.sessions.length? `<div class="row small"><span class="pill ok">${rec.xp} ${t("xp")}</span><span class="pill">🔥 ${rec.streak.count} ${t("streak")}</span><span class="pill info">${rec.sessions.length} sessions</span></div>`:""}
      <h2 class="mt2">2 · ${esc(t("band"))}</h2>
      <div class="band-grid">${banks}</div>
    </div>
    <div class="card">
      <h2>3 · ${esc(t("mode"))}</h2>
      <div class="grid g2">${modes}</div>
      ${st.mode==="skill"? `<div class="field mt"><label class="f" for="sk">${esc(t("skill"))}</label><select id="sk" onchange="A.setSkill(this.value)"><option value="">—</option>${skills}</select></div>`:""}
      ${st.mode==="mock"? `<div class="field mt"><label class="f" for="tm">${esc(t("pacing"))}</label><select id="tm" onchange="A.setTimer(this.value)">${timerOpts}</select><div class="tiny">${esc(t("pacingNote"))}</div></div>`:""}
      <h3 class="mt2">${esc(t("scaffolds"))}</h3>
      <div class="stack">
        <label class="check"><input type="checkbox" ${S.settings.esDir?'checked':''} onchange="A.setOpt('esDir',this.checked)"> ${esc(t("es_dir"))}</label>
        <label class="check"><input type="checkbox" ${S.settings.glossary?'checked':''} onchange="A.setOpt('glossary',this.checked)"> ${esc(t("glossary"))}</label>
        <label class="check"><input type="checkbox" ${S.settings.dys?'checked':''} onchange="A.setOpt('dys',this.checked)"> ${esc(t("dys"))}</label>
        <div class="tiny">${S.settings.lockScaffoldsInMock? "Spanish stems and glossary turn off automatically in Full Mock Test (test conditions). Directions remain bilingual.":"Supports stay on in mock tests (teacher setting)."}</div>
      </div>
      <div class="mt2"><button class="btn gold lg block" ${ready?'':'disabled'} onclick="A.start()">▶ ${esc(t("start"))}</button></div>
    </div>
  </div>
  <div class="grid g3 mt2">
    <div class="card tight"><h3><span class="ic">🧪</span>Test-like interface</h3><p class="small">Split-screen passage and item panes, question counter, flag-for-review, review screen, pause, and submit confirmation — the same habits students need on DRC INSIGHT test day.</p></div>
    <div class="card tight"><h3><span class="ic">♿</span>Accommodations & tools</h3><p class="small">Read-aloud, line reader, masking, highlighter, answer eliminator, notepad, zoom, color contrast and a dyslexia-friendly font — mirroring ELPT universal tools and designated supports.</p></div>
    <div class="card tight"><h3><span class="ic">📊</span>Growth you can see</h3><p class="small">Every session produces a report by ELP standard, reading skill and item type, an estimated Level 1–5, XP, badges, streaks, and a report code for the teacher dashboard.</p></div>
  </div>`;
}

/* ---------- actions ---------- */
const A = {
  go, lang(l){ S.settings.lang=l; saveSettings(); render(); },
  setName(v){ S.student.name=v; }, setCode(v){ S.student.code=v.toUpperCase(); },
  pickBand(b){ S.student.band=b; render(); }, pickMode(m){ S.student.mode=m; render(); }, setSkill(v){ S.student.skill=v; render(); },
  setTimer(v){ S.settings.timer=+v; saveSettings(); }, setOpt(k,v){ S.settings[k]=v; saveSettings(); render(); },
  start(){ startSession(); },
  tool(name){ toggleTool(name); }, zoom(){ S.settings.zoom = (S.settings.zoom%4)+1; saveSettings(); }, contrast(){ const c=["","cream","blue","dark","yellow"]; S.settings.contrast=c[(c.indexOf(S.settings.contrast)+1)%c.length]; saveSettings(); },
  ans(kind, a, b){ answerAction(kind,a,b); }, nav(d){ navItem(d); }, goto(i){ S.session.idx=i; S.session.review=false; render(); }, flag(){ const s=S.session; const id=curItem().id; s.flags[id]=!s.flags[id]; render(); },
  check(){ checkCurrent(); }, review(){ S.session.review=!S.session.review; render(); }, submit(){ submitSession(); }, exit(){ if(confirm(t("confirmExit"))) { stopTimer(); speechSynthesis.cancel(); S.session=null; S.view="home"; render(); } },
  pause(){ S.session.paused=!S.session.paused; render(); }, notes(v){ S.session.notes=v; }, toggleNotes(){ S.session.showNotes=!S.session.showNotes; render(); },
  speak(what){ speak(what); },
  copyCode(){ const el=$("#sharecode"); navigator.clipboard?.writeText(el.textContent).then(()=>toast(t("copied"))).catch(()=>{ el.focus(); toast("Select and copy the code."); }); },
  cert(){ S.view="cert"; render(); }, print(){ window.print(); },
  again(){ S.session=null; S.view="home"; render(); },
  progressStudent(n){ S.student.name=n; render(); },
  // teacher
  tTab(x){ S.teacherTab=x; render(); }, tBand(b){ S.teacherBand=b; render(); }, tImport(){ teacherImport(); }, tScan(){ teacherScanDevice(); }, tExport(){ teacherExportCSV(); }, tClear(){ if(confirm("Remove all imported reports from this device's teacher dashboard?")){ const td=getTeacher(); td.reports=[]; DB.set("teacher",td); render(); } },
  tAddClass(){ teacherAddClass(); }, tDelClass(i){ const td=getTeacher(); td.classes.splice(i,1); DB.set("teacher",td); render(); }, tSet(k,v){ S.settings[k]=v; saveSettings(); render(); },
  tOpen(){ teacherOpen(); }, tLock(){ S.teacherOpen=false; render(); }, tDelReport(i){ const td=getTeacher(); td.reports.splice(i,1); DB.set("teacher",td); render(); }, tBackup(){ teacherBackup(); }, tRestore(){ teacherRestore(); }
};
window.A=A;

/* ---------- init ---------- */
window.addEventListener("DOMContentLoaded", ()=>{ render(); });
window.addEventListener("beforeunload", e=>{ if(S.session && !S.session.done){ e.preventDefault(); e.returnValue=""; } });

/* ============================================================
   Session engine: build, render, answer, check, navigate, submit
   ============================================================ */
function startSession(){
  const st=S.student; const band=st.band; let items=ITEMS[band].slice();
  if(st.mode==="quick"){ items = shuffle(items).slice(0,10).sort((a,b)=>ITEMS[band].indexOf(a)-ITEMS[band].indexOf(b)); }
  if(st.mode==="skill"){ items = items.filter(i=>i.skill===st.skill); if(items.length<6){ // borrow from neighboring bands
      const idx=BANDS.findIndex(b=>b.id===band); const neighbors=[BANDS[idx-1],BANDS[idx+1]].filter(Boolean);
      neighbors.forEach(nb=>{ ITEMS[nb.id].filter(i=>i.skill===st.skill).forEach(i=>items.push(i)); }); }
    if(!items.length){ toast("No items for that skill in this band yet."); return; } }
  const mock = st.mode==="mock";
  S.session = { band, mode:st.mode, items:items.map(i=>i.id), idx:0, answers:{}, flags:{}, checked:{}, firstTry:{}, start:Date.now(), review:false, paused:false, notes:"", showNotes:false,
    tools:{ tts:false, line:false, mask:false, hl:false, elim:false, glossary: S.settings.glossary && !(mock && S.settings.lockScaffoldsInMock), es: S.settings.esDir && !(mock && S.settings.lockScaffoldsInMock) },
    timer: mock && S.settings.timer? S.settings.timer*60 : 0, highlights:{}, done:false };
  // init structured answers
  items.forEach(it=>{ if(it.type==="order") S.session.answers[it.id]=Object.assign(it.options.map((_,i)=>i),{_moved:false}); });
  S.view="session"; render(); if(S.session.timer) startTimer();
}
const curItem = () => itemById(S.session.items[S.session.idx]);

function glossify(text, p, on){
  if(!on || !p || !p.gl) return text;
  // replace only inside text segments (never inside tags/attributes), first occurrence of each glossary word
  const parts = text.split(/(<[^>]+>)/g); const done=glossify._done;
  return parts.map(seg=>{ if(seg.startsWith("<")) return seg; let out=seg;
    Object.entries(p.gl).forEach(([w,d])=>{ if(done.has(w)) return; const re=new RegExp("(^|[^\\w<])("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?![\\w])","i"); if(re.test(out)){ out=out.replace(re,(m,pre,word)=>`${pre}<span class="gl" data-g="${esc(d)}">${word}</span>`); done.add(w); } });
    return out; }).join("");
}

/* ---------- answer actions ---------- */
function answerAction(kind,a,b){
  const s=S.session, it=curItem(); if(s.checked[it.id]) return;
  switch(kind){
    case "mc": s.answers[it.id]=a; break;
    case "ms": { const cur=new Set(s.answers[it.id]||[]); cur.has(a)? cur.delete(a) : cur.add(a); s.answers[it.id]=Array.from(cur).sort((x,y)=>x-y); break; }
    case "strike": { s.struck=s.struck||{}; s.struck[it.id]=s.struck[it.id]||{}; s.struck[it.id][a]=!s.struck[it.id][a]; break; }
    case "mv": { const ord=s.answers[it.id]; const to=a+b; if(to<0||to>=ord.length) return; [ord[a],ord[to]]=[ord[to],ord[a]]; ord._moved=true; break; }
    case "match": { const arr=s.answers[it.id]||it.rows.map(()=>null); arr[a]=b; s.answers[it.id]=arr; break; }
    case "chip": { s.clozeChip=s.clozeChip||{}; s.clozeTarget=s.clozeTarget||{}; const arr=s.answers[it.id]||it.answer.map(()=>null); const tgt=s.clozeTarget[it.id];
      if(tgt!=null){ arr[tgt]=a; s.answers[it.id]=arr; s.clozeTarget[it.id]=null; s.clozeChip[it.id]=null; } else { s.clozeChip[it.id] = s.clozeChip[it.id]===a? null : a; } break; }
    case "blank": { s.clozeChip=s.clozeChip||{}; s.clozeTarget=s.clozeTarget||{}; const arr=s.answers[it.id]||it.answer.map(()=>null); const chip=s.clozeChip[it.id];
      if(chip){ arr[a]=chip; s.answers[it.id]=arr; s.clozeChip[it.id]=null; s.clozeTarget[it.id]=null; } else if(arr[a]){ arr[a]=null; s.answers[it.id]=arr; } else { s.clozeTarget[it.id] = s.clozeTarget[it.id]===a? null : a; } break; }
  }
  render();
}

/* ---------- submit ---------- */
function submitSession(force){
  const s=S.session; if(!s) return;
  const items=s.items.map(id=>itemById(id));
  if(!force && s.mode==="mock"){ const un=items.filter(it=>!isAnswered(it,s.answers[it.id])).length; if(!confirm(un? t("unansweredWarn") : t("confirmSubmit"))) return; }
  stopTimer(); speechSynthesis.cancel(); s.done=true;
  const results = items.map(it=>({ id:it.id, ok:isCorrect(it,s.answers[it.id]), ans:s.answers[it.id], std:it.std, skill:it.skill, type:it.type }));
  const correct=results.filter(r=>r.ok).length, total=results.length, p=pct(correct,total), level=levelFor(p);
  const agg = key => { const o={}; results.forEach(r=>{ o[r[key]]=o[r[key]]||{c:0,n:0}; o[r[key]].n++; if(r.ok) o[r[key]].c++; }); return o; };
  const res = { v:1, name:S.student.name.trim(), code:S.student.code.trim(), band:s.band, mode:s.mode, skillFocus:S.student.skill||"", date:new Date().toISOString(), correct, total, pct:p, level, minutes:Math.round((Date.now()-s.start)/60000), byStd:agg("std"), bySkill:agg("skill"), byType:agg("type"), items:results };
  // student record
  const rec=getStudent(res.name); const prevMock = rec.sessions.filter(x=>x.mode==="mock").slice(-1)[0];
  let gained = correct*XP.item + (s.mode!=="quick"? XP.test:0) + (level>=5? XP.level5 : level>=4? XP.level4:0);
  const today=todayKey(); const y=new Date(); y.setDate(y.getDate()-1); const yKey=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
  if(rec.streak.last!==today){ rec.streak.count = rec.streak.last===yKey? rec.streak.count+1 : 1; rec.streak.last=today; rec.streak.best=Math.max(rec.streak.best,rec.streak.count); gained+=XP.streakDay; }
  rec.xp+=gained; rec.items+=total; if(p===100 && total>=10) rec.perfect++; if(s.mode==="mock"){ rec.fullTests++; if(prevMock && level>prevMock.level) rec.growth++; }
  if(s.mode==="mock"||s.mode==="practice") rec.bestLevel=Math.max(rec.bestLevel,level);
  if(!rec.bandsSeen.includes(s.band)) rec.bandsSeen.push(s.band);
  ["skill","std","type"].forEach(k=>{ const src=k==="skill"?res.bySkill:k==="std"?res.byStd:res.byType; Object.entries(src).forEach(([key,v])=>{ rec[k][key]=rec[k][key]||{c:0,n:0}; rec[k][key].c+=v.c; rec[k][key].n+=v.n; }); });
  rec.sessions.push({ date:res.date, band:s.band, mode:s.mode, code:res.code, correct, total, pct:p, level, minutes:res.minutes, skillFocus:res.skillFocus, items:results.map(r=>r.id+(r.ok?"+":"-")) });
  const stats={ sessions:rec.sessions.length, fullTests:rec.fullTests, bestLevel:rec.bestLevel, bestStreak:rec.streak.best, skill:rec.skill, perfect:rec.perfect, items:rec.items, growth:rec.growth, bands:rec.bandsSeen.length };
  const newBadges=BADGES.filter(b=>!rec.badges.includes(b.id) && b.test(stats)).map(b=>b.id); rec.badges.push(...newBadges);
  saveStudent(rec);
  res.xpGained=gained; res.newBadges=newBadges; res.code_share=makeShareCode(res);
  S.lastResult=res; S.session=null; S.view="results"; render();
  if(newBadges.length) toast("🏅 New badge: "+newBadges.map(id=>BADGES.find(b=>b.id===id).n).join(", "),4000);
}
function makeShareCode(res){
  const compact={ v:1, n:res.name, c:res.code, b:res.band, m:res.mode, d:res.date.slice(0,10), s:res.correct, t:res.total, L:res.level, k:res.skillFocus, i:res.items.map(r=>r.id+(r.ok?"+":"-")) };
  return "ERS1."+btoa(unescape(encodeURIComponent(JSON.stringify(compact))));
}
function parseShareCode(code){
  try{ const raw=code.trim().replace(/^ERS1\./,""); const o=JSON.parse(decodeURIComponent(escape(atob(raw)))); if(!o.n||!o.b||!o.i) return null;
    const items=o.i.map(x=>({ id:x.slice(0,-1), ok:x.endsWith("+") })); items.forEach(r=>{ const it=itemById(r.id); if(it){ r.std=it.std; r.skill=it.skill; r.type=it.type; } });
    return { name:o.n, code:o.c||"", band:o.b, mode:o.m, date:o.d, correct:o.s, total:o.t, pct:pct(o.s,o.t), level:o.L, skillFocus:o.k||"", items, importedAt:new Date().toISOString() };
  }catch(e){ return null; }
}

function describeAnswer(it, ans, isKey){
  if(ans==null || (Array.isArray(ans)&&!ans.length)) return `<i>${esc(t("unanswered"))}</i>`;
  const L="ABCDEFGH";
  switch(it.type){
    case "mc": return L[ans]+". "+it.options[ans].replace(/<[^>]+>/g,"");
    case "pic": return esc(it.options[ans].t);
    case "ms": return ans.map(i=>L[i]).join(", ");
    case "hot": { const p=passageById(it.p); const s=p.notice? p.notice.lines[ans[1]] : p.paras[ans[0]]?.[ans[1]]; return s? "“"+s.replace(/<[^>]+>/g,"")+"”":"—"; }
    case "order": return ans.map((oi,i)=>`${i+1}) ${it.options[oi]}`).join(" ");
    case "match": return ans.map((ci,ri)=>ci==null?"—":it.cols[ci]).join(" / ");
    case "cloze": return ans.map(w=>w||"—").join(", ");
  }
  return "";
}

function growthChart(sessions){
  const w=560,h=200,pl=36,pr=12,pt=14,pb=30; const n=sessions.length; const xs=i=> n===1? pl+(w-pl-pr)/2 : pl+(w-pl-pr)*i/(n-1); const ys=p=> pt+(h-pt-pb)*(1-p/100);
  const pts=sessions.map((s,i)=>[xs(i),ys(s.pct),s]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const grid=[0,35,55,70,85,100].map(v=>`<line x1="${pl}" x2="${w-pr}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)" stroke-dasharray="${v===0||v===100?'':'3 3'}"/><text x="${pl-6}" y="${ys(v)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${v}</text>`).join("");
  const levelsBand=[1,2,3,4,5].map(i=>{ const lo=LEVELS[i].min, hi=i<5?LEVELS[i+1].min:100; return `<text x="${w-pr+2}" y="${(ys(lo)+ys(hi))/2+3}" font-size="9" fill="var(--muted)">L${i}</text>`; }).join("");
  const dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--gold)" stroke="var(--navy)" stroke-width="2"><title>${fmtDate(p[2].date)} · ${p[2].pct}% · Level ${p[2].level}</title></circle>`).join("");
  const labels=pts.map((p,i)=> (n<=8 || i===0 || i===n-1 || i%Math.ceil(n/6)===0)? `<text x="${p[0]}" y="${h-8}" font-size="10" text-anchor="middle" fill="var(--muted)">${new Date(p[2].date).toLocaleDateString(undefined,{month:"numeric",day:"numeric"})}</text>`:"").join("");
  return `<svg viewBox="0 0 ${w+18} ${h}" width="100%" role="img" aria-label="Percent correct over time">${grid}${levelsBand}<path d="${path}" fill="none" stroke="var(--navy-2)" stroke-width="2.5"/>${dots}${labels}</svg><div class="tiny">Percent correct by session; dashed lines mark estimated level cut points.</div>`;
}
