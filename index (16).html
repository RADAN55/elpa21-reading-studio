function teacherOpen(){ const pin=S.settings.teacherPin; if(!pin){ S.teacherOpen=true; render(); return; } const v=prompt("Teacher PIN:"); if(v===pin){ S.teacherOpen=true; render(); } else if(v!==null) toast("Incorrect PIN."); }
function teacherImport(){
  const ta=$("#imp"); const codes=(ta.value.match(/ERS1\.[A-Za-z0-9+/=]+/g)||[]); if(!codes.length){ toast("No report codes found. Codes start with ERS1."); return; }
  const td=getTeacher(); let n=0, dup=0; codes.forEach(c=>{ const r=parseShareCode(c); if(!r) return; const key=r.name.toLowerCase()+"|"+r.date+"|"+r.band+"|"+r.mode+"|"+r.correct; if(td.reports.some(x=>(x.name.toLowerCase()+"|"+x.date+"|"+x.band+"|"+x.mode+"|"+x.correct)===key)){ dup++; return; } td.reports.push(r); n++; });
  DB.set("teacher",td); ta.value=""; toast(`Imported ${n} report${n===1?'':'s'}${dup? `, ${dup} duplicate${dup===1?'':'s'} skipped`:''}.`); render();
}
function teacherScanDevice(){
  const all=getStudents(); const td=getTeacher(); let n=0;
  Object.values(all).forEach(rec=>{ rec.sessions.forEach(s=>{ const key=rec.name.toLowerCase()+"|"+s.date.slice(0,10)+"|"+s.band+"|"+s.mode+"|"+s.correct; if(td.reports.some(x=>(x.name.toLowerCase()+"|"+x.date+"|"+x.band+"|"+x.mode+"|"+x.correct)===key)) return;
    const items=(s.items||[]).map(x=>{ const r={ id:x.slice(0,-1), ok:x.endsWith("+") }; const it=itemById(r.id); if(it){ r.std=it.std; r.skill=it.skill; r.type=it.type; } return r; });
    td.reports.push({ name:rec.name, code:s.code||"", band:s.band, mode:s.mode, date:s.date.slice(0,10), correct:s.correct, total:s.total, pct:s.pct, level:s.level, skillFocus:s.skillFocus||"", items, importedAt:new Date().toISOString(), deviceOnly:!items.length }); n++; }); });
  DB.set("teacher",td); toast(`Added ${n} session${n===1?'':'s'} from this device.`); render();
}
function teacherAddClass(){ const name=$("#cname").value.trim(); if(!name) return; const td=getTeacher(); const code=($("#ccode").value.trim().toUpperCase()||("EL-"+uid().slice(0,4))); td.classes.push({code,name,band:$("#cband").value}); DB.set("teacher",td); render(); }
function teacherBackup(){ const data={ settings:S.settings, students:getStudents(), teacher:getTeacher(), exported:new Date().toISOString(), version:APP_VERSION }; downloadFile("elpa21-reading-studio-backup-"+todayKey()+".json", JSON.stringify(data,null,1), "application/json"); }
function teacherRestore(){ const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json"; inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; f.text().then(txt=>{ try{ const d=JSON.parse(txt); if(d.teacher) DB.set("teacher",d.teacher); if(d.students) DB.set("students",d.students); toast("Backup restored."); render(); }catch(e){ toast("That file is not a valid backup."); } }); }; inp.click(); }
function downloadFile(name, content, type){ const blob=new Blob([content],{type}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }
function csvEsc(v){ v=String(v==null?"":v); return /[",\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }
function teacherExportCSV(){
  const td=getTeacher(); const skills=Object.keys(SKILLS); const stds=Object.keys(STANDARDS);
  const head=["Student","Class code","Band","Session","Skill focus","Date","Correct","Total","Percent","Level",...stds.map(s=>s+" %"),...skills.map(s=>SKILLS[s].name+" %"),"Items (id+/-)"];
  const rows=td.reports.map(r=>{ const by=(key)=>{ const o={}; r.items.forEach(x=>{ const k=x[key]; if(!k) return; o[k]=o[k]||{c:0,n:0}; o[k].n++; if(x.ok) o[k].c++; }); return o; }; const bs=by("std"), bk=by("skill");
    return [r.name,r.code,r.band,r.mode,r.skillFocus,r.date,r.correct,r.total,r.pct,r.level,...stds.map(s=>bs[s]?pct(bs[s].c,bs[s].n):""),...skills.map(s=>bk[s]?pct(bk[s].c,bk[s].n):""),r.items.map(x=>x.id+(x.ok?"+":"-")).join(" ")].map(csvEsc).join(","); });
  downloadFile("elpa21-reading-studio-reports-"+todayKey()+".csv", [head.map(csvEsc).join(","),...rows].join("\n"), "text/csv");
}
function heatClass(p){ return p==null? "" : p<35?"h0":p<55?"h1":p<70?"h2":p<85?"h3":"h4"; }
function renderTeacher(){
  if(!S.teacherOpen) return `<h1>${esc(t("teacher"))}</h1><div class="card" style="max-width:560px"><p class="small">The teacher dashboard imports student report codes, builds a roster and mastery heatmap, runs item analysis, and exports CSV. ${S.settings.teacherPin? "Enter your PIN to open it." : "No PIN is set yet — you can add one in Settings once inside."}</p><button class="btn gold" onclick="A.tOpen()">🔓 Open dashboard</button></div>`;
  const td=getTeacher(); const tabs=[["roster","👥 Roster"],["mastery","🔥 Mastery heatmap"],["standards","📐 Standards"],["items","🧪 Item analysis"],["classes","🏷️ Classes & import"],["settings","⚙️ Settings"]];
  const tabBar=`<div class="tabs">${tabs.map(([k,l])=>`<button class="${S.teacherTab===k?'active':''}" onclick="A.tTab('${k}')">${l}</button>`).join("")}</div>`;
  let body="";
  const reports=td.reports.slice().sort((a,b)=>a.date<b.date?1:-1);
  const byStudent={}; reports.forEach(r=>{ const k=r.name.toLowerCase(); byStudent[k]=byStudent[k]||{name:r.name,code:r.code,reports:[]}; byStudent[k].reports.push(r); if(r.code) byStudent[k].code=r.code; });
  const students=Object.values(byStudent).sort((a,b)=>a.name.localeCompare(b.name));
  if(S.teacherTab==="roster"){
    const rows=students.map((s,i)=>{ const mocks=s.reports.filter(r=>r.mode==="mock"); const latest=s.reports[0]; const best=Math.max(...s.reports.map(r=>r.level)); const latestMock=mocks[0]; const firstMock=mocks[mocks.length-1]; const growth = mocks.length>=2? latestMock.level-firstMock.level : null;
      return `<tr><td><b>${esc(s.name)}</b><div class="tiny">${esc(s.code||"")}</div></td><td>${esc(bandById(latest.band)?.short||latest.band)}</td><td class="num">${s.reports.length}</td><td><span class="lvl-badge lvl-${latest.level}" style="width:30px;height:30px;font-size:.95rem">${latest.level}</span> <span class="tiny">${latest.pct}% · ${esc(t("mode_"+latest.mode))} · ${esc(latest.date)}</span></td><td class="num">${best}</td><td class="num">${growth==null?'—':(growth>0?'+':'')+growth}</td><td class="num">${latestMock? latestMock.pct+'%':'—'}</td></tr>`; }).join("");
    body = `<div class="row between mb"><div class="row"><span class="pill info">${students.length} students</span><span class="pill">${reports.length} reports</span></div><div class="row"><button class="btn sm ghost" onclick="A.tExport()">⬇ Export CSV</button><button class="btn sm ghost" onclick="A.print()">🖨 Print</button></div></div>
      ${students.length? `<div class="scroll"><table class="table"><thead><tr><th>Student</th><th>Band</th><th class="num">Sessions</th><th>Latest</th><th class="num">Best Lv</th><th class="num">Mock growth</th><th class="num">Latest mock</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="card"><p class="small">No reports yet. Go to <b>Classes & import</b> to paste student report codes, or click <b>Scan this device</b> to pull sessions completed on this computer.</p></div>`}`;
  }
  if(S.teacherTab==="mastery"){
    const skills=Object.keys(SKILLS);
    const rows=students.map(s=>{ const agg={}; s.reports.forEach(r=>r.items.forEach(x=>{ if(!x.skill) return; agg[x.skill]=agg[x.skill]||{c:0,n:0}; agg[x.skill].n++; if(x.ok) agg[x.skill].c++; }));
      return `<tr><td><b>${esc(s.name)}</b></td>${skills.map(k=>{ const v=agg[k]; const p=v? pct(v.c,v.n):null; return `<td class="num ${heatClass(p)}" title="${v? v.c+'/'+v.n:''}">${p==null?'·':p+'%'}</td>`; }).join("")}</tr>`; }).join("");
    const classAgg={}; reports.forEach(r=>r.items.forEach(x=>{ if(!x.skill) return; classAgg[x.skill]=classAgg[x.skill]||{c:0,n:0}; classAgg[x.skill].n++; if(x.ok) classAgg[x.skill].c++; }));
    body = `<p class="small">Percent correct by reading skill across all imported reports (device-only sessions without item data are not included). Red &lt; 35 · orange &lt; 55 · yellow &lt; 70 · light green &lt; 85 · green ≥ 85.</p>
      ${students.length? `<div class="scroll"><table class="table heat"><thead><tr><th>Student</th>${skills.map(k=>`<th class="num" title="${esc(SKILLS[k].name)}">${esc(SKILLS[k].short)}</th>`).join("")}</tr></thead><tbody>${rows}<tr><td><b>Class</b></td>${skills.map(k=>{ const v=classAgg[k]; const p=v?pct(v.c,v.n):null; return `<td class="num ${heatClass(p)}"><b>${p==null?'·':p+'%'}</b></td>`; }).join("")}</tr></tbody></table></div>`:`<div class="card"><p class="small">Import reports to see the heatmap.</p></div>`}
      <div class="card tight mt"><h3>Small-group suggestions</h3>${skills.map(k=>{ const low=students.filter(s=>{ const agg={c:0,n:0}; s.reports.forEach(r=>r.items.forEach(x=>{ if(x.skill===k){ agg.n++; if(x.ok) agg.c++; } })); return agg.n>=3 && pct(agg.c,agg.n)<60; }); return low.length? `<div class="small">• <b>${esc(SKILLS[k].name)}</b>: ${low.map(s=>esc(s.name)).join(", ")}</div>`:""; }).join("")||'<span class="small">No skill group is below 60% yet.</span>'}</div>`;
  }
  if(S.teacherTab==="standards"){
    const stds=Object.keys(STANDARDS); const agg={}; reports.forEach(r=>r.items.forEach(x=>{ if(!x.std) return; agg[x.std]=agg[x.std]||{c:0,n:0}; agg[x.std].n++; if(x.ok) agg[x.std].c++; }));
    const levelDist=[1,2,3,4,5].map(l=>students.filter(s=>s.reports[0].level===l).length);
    body = `<div class="grid g2"><div class="card"><h3>Class performance by ELP standard</h3><div class="std-list">${stds.map(k=>{ const v=agg[k]||{c:0,n:0}; const p=pct(v.c,v.n); return `<div class="std-row"><span><b>${esc(k)}</b> ${esc(STANDARDS[k].name)}</span><div class="bar"><i class="${barClass(p)}" style="width:${p}%"></i></div><span class="num"><b>${v.n?p+'%':'—'}</b></span></div>`; }).join("")}</div></div>
      <div class="card"><h3>Latest estimated level per student</h3><div class="gauge" style="height:120px">${[1,2,3,4,5].map((l,i)=>`<div class="l${l} on" style="height:${Math.max(12,levelDist[i]/Math.max(1,...levelDist)*100)}%">${levelDist[i]}</div>`).join("")}</div><div class="tiny">Count of students whose most recent session was estimated at each level. On the real ELPT, exit requires Level 4–5 in all four domains.</div></div></div>`;
  }
  if(S.teacherTab==="items"){
    const band=S.teacherBand; const its=ITEMS[band]; const stat={}; reports.filter(r=>r.band===band).forEach(r=>r.items.forEach(x=>{ stat[x.id]=stat[x.id]||{c:0,n:0}; stat[x.id].n++; if(x.ok) stat[x.id].c++; }));
    const rows=its.map(it=>{ const v=stat[it.id]; const p=v?pct(v.c,v.n):null; return `<tr><td>${esc(it.id)}</td><td>${it.stem.replace(/<[^>]+>/g,"").slice(0,90)}…</td><td>${esc(ITEM_TYPES[it.type].name)}</td><td>${esc(SKILLS[it.skill].name)}</td><td>${esc(it.std)}</td><td class="num">${it.dok}</td><td class="num ${heatClass(p)}">${p==null?'·':p+'%'}</td><td class="num">${v?v.n:0}</td></tr>`; }).join("");
    body = `<div class="row mb"><label class="f" style="margin:0">Band:</label><div class="seg">${BANDS.map(b=>`<button class="${band===b.id?'active':''}" onclick="A.tBand('${b.id}')">${esc(b.short)}</button>`).join("")}</div></div>
      <p class="small">p-value = percent of students answering correctly. Items below 40% deserve a re-teach or a second look at the item; items above 95% may be too easy for this group.</p>
      <div class="scroll"><table class="table"><thead><tr><th>ID</th><th>Stem</th><th>Type</th><th>Skill</th><th>Std</th><th class="num">DOK</th><th class="num">p-value</th><th class="num">n</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  if(S.teacherTab==="classes"){
    body = `<div class="grid g2"><div class="card"><h3>Import report codes</h3><p class="small">Paste one or more student report codes (they start with <code>ERS1.</code>). You can paste a whole column copied from a Google Form response sheet.</p><textarea id="imp" placeholder="ERS1.eyJ2IjoxLCJuIjoi…"></textarea><div class="row mt"><button class="btn gold" onclick="A.tImport()">⬆ Import</button><button class="btn ghost" onclick="A.tScan()">🖥 Scan this device</button><button class="btn ghost" onclick="A.tBackup()">💾 Backup JSON</button><button class="btn ghost" onclick="A.tRestore()">📂 Restore</button></div>
        <h3 class="mt2">Imported reports (${reports.length})</h3><div class="scroll" style="max-height:260px"><table class="table"><tbody>${reports.map((r,i)=>`<tr><td>${esc(r.name)}</td><td>${esc(r.band)}</td><td>${esc(r.mode)}</td><td>${esc(r.date)}</td><td class="num">${r.pct}%</td><td class="num">L${r.level}</td><td><button class="btn sm ghost" onclick="A.tDelReport(${td.reports.indexOf(r)})">✕</button></td></tr>`).join("")}</tbody></table></div>${reports.length? `<div class="mt"><button class="btn sm danger" onclick="A.tClear()">Clear all reports</button></div>`:""}</div>
      <div class="card"><h3>Class codes</h3><p class="small">Give each class a code so reports group correctly. Students type it on the home screen.</p><div class="field"><label class="f">Class name</label><input id="cname" type="text" placeholder="e.g. Block 2 — Emerging 9–12"></div><div class="row"><div class="field" style="flex:1"><label class="f">Code (optional)</label><input id="ccode" type="text" placeholder="auto"></div><div class="field" style="flex:1"><label class="f">Band</label><select id="cband">${BANDS.map(b=>`<option value="${b.id}">${esc(b.label)}</option>`).join("")}</select></div></div><button class="btn" onclick="A.tAddClass()">＋ Add class</button>
        <table class="table mt"><tbody>${td.classes.map((c,i)=>`<tr><td><b>${esc(c.code)}</b></td><td>${esc(c.name)}</td><td>${esc(bandById(c.band)?.short||"")}</td><td class="num">${reports.filter(r=>r.code===c.code).length} reports</td><td><button class="btn sm ghost" onclick="A.tDelClass(${i})">✕</button></td></tr>`).join("")||'<tr><td class="small">No classes yet.</td></tr>'}</tbody></table>
        <h3 class="mt2">Collect codes with Google Forms</h3><p class="small">Create a Form with three short-answer questions — <i>Name</i>, <i>Class code</i>, <i>Report code</i> — and post the link in Google Classroom. Open the responses sheet, copy the Report code column, and paste it into the import box. Each report is only a few hundred characters.</p></div></div>`;
  }
  if(S.teacherTab==="settings"){
    body = `<div class="grid g2"><div class="card"><h3>Test conditions</h3>
      <label class="check"><input type="checkbox" ${S.settings.lockScaffoldsInMock?'checked':''} onchange="A.tSet('lockScaffoldsInMock',this.checked)"> Turn off Spanish stems and glossary automatically in Full Mock Test</label>
      <div class="field mt"><label class="f">Default pacing timer for mock tests</label><select onchange="A.tSet('timer',+this.value)">${[0,20,30,40,50,60].map(m=>`<option value="${m}" ${S.settings.timer==m?'selected':''}>${m===0?'Off (ELPT is untimed)':m+' minutes'}</option>`).join("")}</select></div>
      <div class="field"><label class="f">Teacher PIN (protects this dashboard on shared devices)</label><input type="password" value="${esc(S.settings.teacherPin)}" onchange="A.tSet('teacherPin',this.value)" placeholder="leave blank for none"></div>
      <button class="btn ghost sm" onclick="A.tLock()">🔒 Lock dashboard</button></div>
      <div class="card"><h3>Suggested routine</h3><p class="small"><b>Week 1:</b> Full Mock Test → baseline level and heatmap. <b>Weekly:</b> two Quick Checks + one Skill Drill on the lowest skill. <b>Every 4–6 weeks:</b> Full Mock Test to measure growth. Print certificates when students reach Level 3, 4 and 5 — the badge wall motivates Emerging students more than the percentage does.</p><p class="small"><b>Compliance tip:</b> export the CSV monthly and attach it to Ellevation or your §15 EL progress monitoring binder as evidence of targeted reading intervention.</p></div></div>`;
  }
  return `<div class="row between"><h1>${esc(t("teacher"))} dashboard</h1><span class="pill">Device-local · nothing leaves this browser</span></div>${tabBar}${body}`;
}

</script>
</body>
